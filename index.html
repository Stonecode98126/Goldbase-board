<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我們家的公布欄</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面:上方工具列,下方整塊是 3D 軟木塞板河道;打開的主題是疊在板子上的紙張面板 */
:root{
  --wall:#E6D7BC;
  --ink:#3A2E25;
  --ink-soft:#5E4E41;
  --paper:#FFFBF2;
  --accent:#8A3220;
  --rule:#B9A683;
  --font-display:"LXGW WenKai TC","Noto Sans TC",sans-serif;
  --font-body:"Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 20px 12px}
h1{margin:0;font-family:var(--font-display);font-size:28px;line-height:1.2}
#status{font-size:13px;color:var(--ink-soft);min-height:20px}
.pill{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:22px;background:var(--paper)}
.primary{min-height:44px;padding:0 18px;border:0;border-radius:22px;background:var(--accent);color:#fff;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.tags button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
#stage{position:relative;flex:1 1 auto;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}
#gl.hover{cursor:pointer}
.bar{position:absolute;left:16px;top:8px;display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--ink);border-radius:26px;padding:4px 14px 4px 4px;max-width:calc(100% - 32px)}
.bar button{width:44px;height:44px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:20px;line-height:1}
.bar span{font-size:13px}
#panel{opacity:.995;position:absolute;top:16px;right:16px;bottom:16px;width:380px;max-width:calc(100% - 32px);background:var(--paper);border-radius:12px;box-shadow:0 12px 30px rgba(58,46,37,.35);padding:16px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#panel>*{flex:none}
#panel[hidden]{display:none}
#panel h2{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
h3{margin:0;font-size:13px}
#panel p{margin:0;overflow-wrap:anywhere}
.body{white-space:pre-wrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{align-self:flex-start;font-size:12px;font-weight:700;padding:1px 10px;border:1.5px solid var(--ink);border-radius:12px}
.link{min-height:44px;padding:0 10px;border:0;background:transparent;font-weight:700}
.meta{font-size:13px;color:var(--ink-soft)}
.due{align-self:flex-start;display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;border:1.5px solid var(--ink)}
.due.soon{background:var(--accent);border-color:var(--accent);color:#fff}
.ack{flex:none;min-height:44px;padding:0 14px;border:2px solid var(--ink);border-radius:8px;background:#FFF1B8;font-weight:700}
.ack:disabled{background:transparent;border-style:dashed;cursor:default}
.sec{border-top:2px dashed var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.log{margin:0;padding:0 0 0 12px;list-style:none;border-left:2px solid var(--ink);font-size:13px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.log span{color:var(--ink-soft)}
.cm{padding:8px 10px;border-radius:3px}
.cm small{color:var(--ink-soft)}
.line{display:flex;gap:8px}
.line input{flex:1 1 auto;min-width:0}
input[type=text],input[type=datetime-local],select,textarea{min-height:44px;padding:8px 12px;border:2px solid var(--ink);border-radius:8px;background:#fff;width:100%}
textarea{min-height:110px;resize:vertical}
.send{flex:none;min-height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700}
button:disabled{opacity:.6;cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;pointer-events:none}
.msg[hidden]{display:none}
.msg p{margin:0;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:14px 18px;max-width:420px}
dialog{border:0;border-radius:12px;background:var(--paper);color:var(--ink);padding:20px;width:min(440px,calc(100vw - 32px));max-height:calc(100% - 32px);box-shadow:0 12px 30px rgba(58,46,37,.4)}
dialog::backdrop{background:rgba(58,46,37,.45)}
dialog h2{margin:0 0 12px;font-family:var(--font-display);font-size:24px}
dialog form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:13px;font-weight:700}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.who-list{display:flex;flex-direction:column;gap:8px}
.who-list button{min-height:48px;border:2px solid var(--ink);border-radius:10px;font-weight:700;text-align:left;padding:0 16px}
.err{color:var(--accent);font-size:13px;font-weight:700;min-height:20px}
.danger{min-height:44px;padding:0 14px;border:2px solid var(--accent);border-radius:8px;background:transparent;color:var(--accent);font-weight:700}
@media (max-width:719px){
  body{font-size:13px}
  header{padding:6px 10px 4px;gap:4px 8px}
  header>div:first-child{display:flex;align-items:baseline;gap:8px;margin-right:auto}
  h1{font-size:16px}
  #status{font-size:11px;min-height:0}
  header .pill,header .primary{min-height:30px;padding:0 8px;font-size:12px;border-width:1.5px;border-radius:15px}
  .tags{margin-left:0;flex-wrap:nowrap;overflow-x:auto;width:100%;order:9;gap:6px}
  .tags button{flex:none}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-width:none;height:58%;padding:12px 14px 14px;gap:8px}
  #panel h2{font-size:18px}
  .bar span{display:none}
  .bar{padding:3px;top:6px;left:8px;gap:6px}
  .bar button{width:32px;height:32px;font-size:16px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>我們家的公布欄</h1>
    <div id="status" role="status" aria-live="polite">讀取中…</div>
  </div>
  <button type="button" class="pill" id="whoBtn">選擇我是誰</button>
  <button type="button" class="primary" id="newBtn">＋ 貼新主題</button>
  <div class="tags" id="tags" role="group" aria-label="分類標籤"></div>
</header>
<div id="stage">
  <canvas id="gl" aria-label="3D 公布欄河道。拖曳或用左上角按鈕左右移動,點便利貼打開主題。"></canvas>
  <div class="msg" id="msg" hidden><p id="msgText"></p></div>
  <div class="bar">
    <button type="button" id="prev" aria-label="上一個主題(較新)">&#8249;</button>
    <button type="button" id="next" aria-label="下一個主題(較早)">&#8250;</button>
    <span>拖曳板子左右移動,點便利貼打開</span>
  </div>
  <section id="panel" hidden aria-label="打開的主題"></section>
</div>

<dialog id="whoDlg" aria-labelledby="whoTitle">
  <h2 id="whoTitle">你是哪一位?</h2>
  <div class="who-list" id="whoList"></div>
  <p class="meta" style="margin:12px 0 0">會記在這台裝置上,之後可以從上方按鈕切換。</p>
</dialog>

<dialog id="topicDlg" aria-labelledby="topicTitle">
  <h2 id="topicTitle">貼新主題</h2>
  <form id="topicForm">
    <label class="field"><span>標題</span><input type="text" id="f-title" maxlength="60" required autocomplete="off"></label>
    <label class="field"><span>內容</span><textarea id="f-body" maxlength="2000"></textarea></label>
    <label class="field"><span>分類標籤</span><select id="f-tag"></select></label>
    <div id="newTag" hidden>
      <div class="line">
        <label class="field" style="flex:1"><span>新標籤名稱</span><input type="text" id="f-tagname" maxlength="12" autocomplete="off"></label>
        <label class="field" style="flex:none;width:80px"><span>顏色</span><input type="color" id="f-tagcolor" value="#FFF1B8" style="min-height:44px;padding:2px;border:2px solid var(--ink);border-radius:8px;width:100%"></label>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="f-due"><span>到期日倒數</span></label>
    <label class="field" id="dueField" hidden><span>到期時間</span><input type="datetime-local" id="f-dueat"></label>
    <label class="check"><input type="checkbox" id="f-read"><span>全家已讀確認(每個人都要按「知道了」)</span></label>
    <div class="err" id="f-err" role="alert"></div>
    <div class="row">
      <button type="button" class="danger" id="f-del" hidden>刪除主題</button>
      <span style="display:flex;gap:8px;margin-left:auto">
        <button type="button" class="pill" id="f-cancel">取消</button>
        <button type="submit" class="send" id="f-save">貼上去</button>
      </span>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ====== 設定:GAS 網頁應用程式網址 ====== */
var API=' https://script.google.com/macros/s/AKfycbyCEo1PxK7mxp6z1rXtuHnUnR5xooVQEET5QWKI_Lz5J7lA89Riqth6gHgN_9iHBU5BLg/exec';
var POLL_MS=45000;

var S={members:[],tags:[],topics:[]}, sig='', me=null, details={};
var $=function(id){ return document.getElementById(id); };
var stage=$('stage'), canvas=$('gl'), panel=$('panel'), statusEl=$('status');
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var FD='"LXGW WenKai TC","Noto Sans TC",sans-serif', FB='"Noto Sans TC",system-ui,sans-serif';
var WEEK=['日','一','二','三','四','五','六'];

/* ---------- 資料存取 ---------- */
function apiGet(query){
  return fetch(API+'?'+query+'&_='+Date.now()).then(function(r){ return r.json(); }).then(unwrap);
}
function apiPost(body){
  body.member_id=me;
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){ return r.json(); }).then(unwrap);
}
function unwrap(j){ if(!j||!j.ok) throw new Error(j&&j.error?j.error:'伺服器沒有回應'); return j.data; }
function setStatus(t){ statusEl.textContent=t; }
function saved(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function save(key,v){ try{ localStorage.setItem(key,v); }catch(e){} }

function member(id){ for(var i=0;i<S.members.length;i++) if(S.members[i].member_id===id) return S.members[i]; return null; }
function memberName(id){ var m=member(id); return m?m.name:'(已不在名單)'; }
function color(c,fallback){ return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:fallback; }
function tagOf(id){ for(var i=0;i<S.tags.length;i++) if(S.tags[i].tag_id===id) return {name:S.tags[i].name,color:color(S.tags[i].color,'#FFFBF2')}; return {name:'未分類',color:'#FFFBF2'}; }
function pad(n){ return n<10?'0'+n:''+n; }
function dayStart(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); }
function dayLabel(d){
  var diff=Math.round((dayStart(new Date())-dayStart(d))/864e5), md=(d.getMonth()+1)+'/'+d.getDate()+' ('+WEEK[d.getDay()]+')';
  return diff===0?'今天 '+md:diff===1?'昨天 '+md:md;
}
function fmtTime(iso){
  var d=new Date(iso); if(isNaN(d)) return '';
  var diff=Math.round((dayStart(new Date())-dayStart(d))/864e5), hm=pad(d.getHours())+':'+pad(d.getMinutes());
  return diff===0?'今天 '+hm:diff===1?'昨天 '+hm:(d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
function dueInfo(t){
  if(!t.due_enabled||!t.due_at) return null;
  var d=new Date(t.due_at); if(isNaN(d)) return null;
  var ms=d-new Date(), days=Math.round((dayStart(d)-dayStart(new Date()))/864e5), label=(d.getMonth()+1)+'/'+d.getDate()+' ('+WEEK[d.getDay()]+')';
  var text=ms<0?'已到期':days===0?'今天到期':days===1?'明天到期':'還有 '+days+' 天';
  return {text:text+' · '+label,full:text+' · '+label+' '+pad(d.getHours())+':'+pad(d.getMinutes()),soon:days<=3};
}
function readers(t){ return (t.read_by||[]).filter(function(id){ return !!member(id); }); }
function footText(t){
  var parts=[];
  if(t.read_confirm_enabled){ var n=readers(t).length; parts.push(n>=S.members.length?'全家都看過了':'已讀 '+n+'/'+S.members.length); }
  parts.push(t.comment_count?'留言 '+t.comment_count:'還沒有留言');
  return parts.join(' · ');
}

/* ---------- 便利貼貼圖 ---------- */
var TW=640, PAD=44;
function wrap(ctx,text,maxW,maxLines){
  var lines=[],cur='',src=String(text||'').replace(/\s+/g,' ');
  for(var i=0;i<src.length;i++){
    var ch=src[i];
    if(ctx.measureText(cur+ch).width>maxW && cur && '。,、!?…)」'.indexOf(ch)<0){ lines.push(cur); cur=ch; } else cur+=ch;
  }
  if(cur) lines.push(cur);
  if(maxLines && lines.length>maxLines){ lines=lines.slice(0,maxLines); var l=lines[maxLines-1]; lines[maxLines-1]=l.slice(0,l.length-1)+'…'; }
  return lines;
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawCard(t,cv){
  cv=cv||document.createElement('canvas');
  var ctx=cv.getContext('2d'), inner=TW-PAD*2, tag=tagOf(t.tag_id), due=dueInfo(t);
  ctx.font='700 52px '+FD; var tW=ctx.measureText(t.title).width, mq=!reduce&&tW>inner, tl=mq?['']:wrap(ctx,t.title,inner,2);
  ctx.font='400 28px '+FB; var bl=wrap(ctx,t.body,inner,2);
  var H=56+44+18+tl.length*66+4+36+10+bl.length*40+(due?20+52:0)+20+36+34;
  cv.width=TW; cv.height=H; ctx=cv.getContext('2d');
  ctx.fillStyle=tag.color; ctx.fillRect(0,0,TW,H);
  var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(255,255,255,.25)'); g.addColorStop(1,'rgba(58,46,37,.08)');
  ctx.fillStyle=g; ctx.fillRect(0,0,TW,H);
  ctx.textBaseline='top'; ctx.fillStyle='#3A2E25'; ctx.strokeStyle='#3A2E25';
  var y=56;
  ctx.font='700 26px '+FB; var tw=Math.min(ctx.measureText(tag.name).width+36,inner);
  ctx.fillStyle='rgba(255,251,242,.6)'; rr(ctx,PAD,y,tw,44,22); ctx.fill();
  ctx.lineWidth=3; rr(ctx,PAD,y,tw,44,22); ctx.stroke(); ctx.fillStyle='#3A2E25'; ctx.fillText(tag.name,PAD+18,y+8,inner-36);
  y+=44+18;
  ctx.font='700 52px '+FD; tl.forEach(function(l){ ctx.fillText(l,PAD,y+4); y+=66; });
  y+=4; ctx.font='400 26px '+FB; ctx.fillStyle='#5E4E41'; ctx.fillText(memberName(t.author_id)+' · '+fmtTime(t.created_at),PAD,y,inner); y+=36+10;
  ctx.fillStyle='#3A2E25'; ctx.font='400 28px '+FB; bl.forEach(function(l){ ctx.fillText(l,PAD,y); y+=40; });
  if(due){
    y+=20; ctx.font='700 26px '+FB; var w=Math.min(ctx.measureText(due.text).width+70,inner);
    rr(ctx,PAD,y,w,52,8); if(due.soon){ ctx.fillStyle='#8A3220'; ctx.fill(); } else { ctx.fillStyle='#FFFBF2'; ctx.fill(); ctx.lineWidth=3; ctx.stroke(); }
    var c=due.soon?'#FFFFFF':'#3A2E25'; ctx.strokeStyle=c; ctx.fillStyle=c; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(PAD+28,y+26,12,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD+28,y+18); ctx.lineTo(PAD+28,y+26); ctx.lineTo(PAD+34,y+30); ctx.stroke();
    ctx.fillText(due.text,PAD+52,y+11,w-62); y+=52; ctx.fillStyle='#3A2E25'; ctx.strokeStyle='#3A2E25';
  }
  y+=20; ctx.font='500 26px '+FB; ctx.fillText(footText(t),PAD,y,inner);
  cv._mq=mq?tW:0;
  return cv;
}
/* 標題太長時,用一條會捲動的貼圖當跑馬燈 */
function makeStrip(t,tW,h,H){
  var inner=TW-PAD*2, texW=Math.ceil(tW+140), sc=document.createElement('canvas'); sc.width=texW; sc.height=72;
  var x=sc.getContext('2d'); x.font='700 52px '+FD; x.textBaseline='top'; x.fillStyle='#3A2E25'; x.fillText(t.title,0,4);
  var tex=new THREE.CanvasTexture(sc); tex.encoding=THREE.sRGBEncoding; tex.wrapS=THREE.RepeatWrapping; tex.generateMipmaps=false; tex.minFilter=THREE.LinearFilter; tex.repeat.x=inner/texW;
  var m=own(new THREE.Mesh(new THREE.PlaneGeometry(inner/TW*CW,72/TW*CW),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false})));
  var yc=118+36, u=yc/H; m.position.set(0,h/2-yc/TW*CW,.02+.16*u*u+.015); m.renderOrder=2;
  return {mesh:m,tex:tex,texW:texW};
}
function labelCanvas(text){
  var cv=document.createElement('canvas'); cv.width=512; cv.height=96; var ctx=cv.getContext('2d');
  ctx.fillStyle='#FFFBF2'; rr(ctx,4,4,504,88,10); ctx.fill();
  ctx.fillStyle='#3A2E25'; ctx.font='700 38px '+FB; ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.fillText(text,256,50,480);
  return cv;
}
function corkCanvas(){
  var cv=document.createElement('canvas'); cv.width=cv.height=512; var ctx=cv.getContext('2d');
  ctx.fillStyle='#C9A56F'; ctx.fillRect(0,0,512,512);
  var s=7; function rnd(){ s=(s*16807)%2147483647; return s/2147483647; }
  for(var i=0;i<5200;i++){ var d=rnd(); ctx.fillStyle=d<.5?'rgba(110,74,36,'+(.12+rnd()*.25)+')':'rgba(240,214,170,'+(.12+rnd()*.25)+')'; var r=.6+rnd()*2.4; ctx.beginPath(); ctx.arc(rnd()*512,rnd()*512,r,0,6.3); ctx.fill(); }
  return cv;
}

/* ---------- 場景 ---------- */
var renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true}); }catch(e){ showMsg('這個裝置無法顯示 3D 畫面(WebGL 沒有啟用)。'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene(); scene.background=new THREE.Color(0xE6D7BC);
var FOV=40, CAM_Z=10.4, camera=new THREE.PerspectiveCamera(FOV,1,.1,100); camera.position.set(0,0,CAM_Z);
var GAP=3.3, CW=2.6, PER=2, LEFT=-2.4, RIGHT=3*3.3+2.4, BOARD_H=7.4;
scene.add(new THREE.HemisphereLight(0xFFF6E6,0x9A7A55,.85));
var sun=new THREE.DirectionalLight(0xFFE9C8,.65); sun.castShadow=true; sun.shadow.mapSize.set(4096,1024); sun.shadow.bias=-.0006; sun.shadow.radius=4;
scene.add(sun); scene.add(sun.target);
var world=new THREE.Group(); scene.add(world);
var corkImg=corkCanvas();
var wood=new THREE.MeshStandardMaterial({color:0x7A5230,roughness:.8});
var pinGeo=new THREE.SphereGeometry(.075,16,12), pinMat=new THREE.MeshStandardMaterial({color:0x8A3220,roughness:.35});
var aniso=renderer.capabilities.getMaxAnisotropy(), cards=[], meshes=[], labels=[];

function own(mesh){ mesh.userData.own=true; return mesh; }
function clearWorld(){
  world.traverse(function(o){
    if(!o.isMesh||!o.userData.own) return;
    o.geometry.dispose(); if(o.material.map) o.material.map.dispose(); if(o.material!==wood&&o.material!==pinMat) o.material.dispose();
  });
  while(world.children.length) world.remove(world.children[0]);
  cards=[]; meshes=[]; labels=[];
}
function build(){
  var selId=selected>=0&&cards[selected]?cards[selected].t.topic_id:null;
  clearWorld(); hover=-1; selected=-1;
  narrow=(stage.clientWidth||1)<720; CW=narrow?1.75:2.6; GAP=narrow?2.2:3.3; PER=narrow?3:2; LEFT=-(CW/2+1.1);
  var k0=CW/2.6;

  camera.position.set(camX+px*.35,-py*.2,CAM_Z); camera.rotation.set(py*.018,-px*.03,0);
  for(var i=0;i<cards.length;i++){
    var c=cards[i], isSel=i===selected, on=visible(i);
    c.sel+=((isSel?1:0)-c.sel)*k; c.lift+=((i===hover&&!isSel?1:0)-c.lift)*k; c.dim+=((on?1:.18)-c.dim)*k;
    if(narrow) tmp.set(camX,1.6,5.0); else tmp.set(camX-1.9,1.2,4.4);
    var s=c.sel, g=c.group;
    g.position.x=c.home.x+(tmp.x-c.home.x)*s;
    g.position.y=c.home.y+(tmp.y-c.home.y)*s;
    g.position.z=c.home.z+(tmp.z-c.home.z)*s+c.lift*.45;
    var sway=reduce?0:Math.sin(time*.9+c.phase)*.018;
    g.rotation.x=-(.02+sway+c.lift*.1)*(1-s);
    g.rotation.z=c.tilt*(1-s)+(reduce?0:Math.sin(time*.6+c.phase)*.006*(1-s));
    var sc2=1+c.lift*.04+s*(narrow?0:.12); g.scale.set(sc2,sc2,1);
    c.mat.opacity=c.dim; c.mesh.castShadow=c.dim>.5;
    if(c.strip){ c.strip.tex.offset.x=(time*80/c.strip.texW)%1; c.strip.mesh.material.opacity=c.dim; }
  }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
